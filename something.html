<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form enctype="multipart/form-data">
    <hr>
    value & readonly: <input type="text" name="n1" value="prashant" readonly>
    <hr>
    placeholder: <input type="text" name="n2" placeholder="prashant">
    <hr>
    hidden: <input type="hidden" name="n3" value="prashant">
    <hr>
    file (photo): <input type="file" name="photo" accept="image/*">
    <hr>
    required: <input type="text" name="n4" required>
    <hr>
    autocomplete: <input type="text" name="Email" autocomplete="on">
    <hr>
    autofocus: <input type="text" name="n3" autofocus>
    <hr>
    <input type="image" name="image" width="30"
    src="">
    <input type="reset">
    <input type="submit" name="submit" value="send">
    <button>send</button>
    </form>
</body>
</html>
